name: Verify Pocket Cook
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: dart format lib test integration_test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
        working-directory: firebase
      - run: npm run validate && npm run test:data && npm run test:rules
        working-directory: firebase
